<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Library</title>

  <!-- Bootstrap first, then our own styles so they can override it -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5 library">

    <header class="mb-4">
      <h1 class="fw-bold mb-1">Research Library</h1>
      <p class="text-body-secondary mb-0">Last updated __UPDATED__</p>
    </header>

    <div class="row g-2 mb-2">
      <div class="col-md-8">
        <input id="q" class="form-control" type="search" placeholder="Search title, summary, keywords...">
      </div>
      <div class="col-md-4">
        <select id="cat" class="form-select">
          <option value="">All categories</option>
          __OPTIONS__
        </select>
      </div>
    </div>
    <p id="count" class="small text-body-secondary mb-4"></p>

    __CARDS__

  </main>
</body>
</html>
